name: Build Jekyll site

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
