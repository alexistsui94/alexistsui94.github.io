---
---
<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moved — {{ page.title }}</title>
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <main id="main-content" class="wrap">
    <section class="empty-state">
      <span>Moved</span>
      <h2>This page has<br>a new home.</h2>
      <p>The notes that used to live here are now part of Writing: <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_label | default: page.redirect_to }}</a>.</p>
    </section>
  </main>
</body>
</html>
