<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" role="img" aria-labelledby="alTitle alDesc">
  <title id="alTitle">The agent loop</title>
  <desc id="alDesc">A task goes to the model. The model calls a tool with a name and arguments. The tool returns a result or an error, which goes back into the model. The loop repeats until the model calls no more tools or a step limit is reached. Any tool with a side effect needs a confirmation.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#30352f}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.8px;fill:#8b9188}
      .title{font-size:26px;font-weight:600;letter-spacing:.2px}
      .sub{font-size:15.5px;fill:#60675e}
      .node{font-size:18px;font-weight:600}
      .sub2{font-size:13px;fill:#8b9188}
      .note{font-size:15px;fill:#60675e}
      .flow{fill:none;stroke:#7a8b7c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7a8b7c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="374" fill="#fbfaf7"/>

  <text class="eyebrow" x="40" y="44">AGENT LOOP</text>
  <text class="title" x="40" y="82">Model, tool, result, repeat</text>
  <text class="sub" x="40" y="112">An agent is a loop with tools. The model decides when it has enough.</text>

  <rect x="26" y="152" width="130" height="68" fill="#fffdfa" stroke="#d3cfc2" stroke-width="1.2"/>
  <text class="node" x="91" y="186" text-anchor="middle">Your task</text>
  <text class="sub2" x="91" y="206" text-anchor="middle">one sentence</text>

  <rect x="236" y="152" width="130" height="68" fill="#fffdfa" stroke="#4b6b52" stroke-width="1.5"/>
  <text class="node" x="301" y="186" text-anchor="middle">Model</text>
  <text class="sub2" x="301" y="206" text-anchor="middle">reads the window</text>

  <rect x="446" y="152" width="130" height="68" fill="#fffdfa" stroke="#d3cfc2" stroke-width="1.2"/>
  <text class="node" x="511" y="186" text-anchor="middle">Tool call</text>
  <text class="sub2" x="511" y="206" text-anchor="middle">name + arguments</text>

  <rect x="656" y="152" width="130" height="68" fill="#fffdfa" stroke="#d3cfc2" stroke-width="1.2"/>
  <text class="node" x="721" y="186" text-anchor="middle">Result</text>
  <text class="sub2" x="721" y="206" text-anchor="middle">file, test, error</text>

  <path class="flow" d="M156 186 H228" marker-end="url(#ar)"/>
  <path class="flow" d="M366 186 H438" marker-end="url(#ar)"/>
  <path class="flow" d="M576 186 H648" marker-end="url(#ar)"/>

  <path class="flow" d="M721 220 V302 H301 V228" marker-end="url(#ar)"/>
  <text class="note" x="332" y="292">the result goes back in</text>

  <path d="M511 220 V242" stroke="#8b9188" stroke-width="1.3" fill="none"/>
  <text class="note" x="511" y="262" text-anchor="middle">confirm before writes</text>

  <text class="note" x="40" y="344">The loop ends when the model calls no tool, or when a step limit is reached.</text>
</svg>
