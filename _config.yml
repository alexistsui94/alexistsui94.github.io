title: "Alexis Tsui"
description: "Notes on ERP implementation, project delivery, applied AI and code."
url: "https://alexistsui94.github.io"
baseurl: ""
author:
  name: "Alexis Tsui"
  email: "alexistsui94@gmail.com"
  github: "alexistsui94"

permalink: /:categories/:title/

collections:
  pages:
    output: true
    permalink: /:path/

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      read_time: true
      comments: false
      share: false
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single

markdown: kramdown
highlighter: rouge
paginate: 5
paginate_path: /page:num/

timezone: Asia/Hong_Kong
locale: "en"
future: false
