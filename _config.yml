title: "Alexis Tsui"
description: "Technology, projects, economics, finance, and essays."
url: "https://alexistsui94.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes"

plugins:
  - jekyll-include-cache

minimal_mistakes_skin: "default"
search: true
permalink: /:categories/:title/

collections:
  pages:
    output: true
    permalink: /:path/

include:
  - _pages

author:
  name: "Alexis Tsui"
  avatar: "/assets/images/avatar.jpg"
  bio: "Writing about technology, systems, projects, economics, finance, and personal essays."
  location: "Hong Kong / Asia"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/alexistsui94"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

markdown: kramdown
highlighter: rouge
paginate: 5
paginate_path: /page:num/

timezone: Asia/Hong_Kong
locale: "en-US"
