# ----------------------------
# 网站基本信息
# ----------------------------
title: "Alexisxu"
description: "读书笔记 · 杂文随想 · 个人介绍"
url: "https://alexistsui94.github.io"
baseurl: ""

# ----------------------------
# 主题设置
# ----------------------------
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: default

# ----------------------------
# 插件（GitHub Pages 支持）
# ----------------------------
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# ----------------------------
# 分页
# ----------------------------
paginate: 5
paginate_path: "/page:num/"

# ----------------------------
# 搜索与作者
# ----------------------------
search: false
author:
  name: Alexis Xu
  bio: "哲学 · 技术 · 生活"
  email: your-email@example.com

# ----------------------------
# ✅ 启用自动分类/标签归档（关键！）
# ----------------------------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# ----------------------------
# 集合与默认布局
# ----------------------------
collections:
  pages:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

# ----------------------------
# CSS 压缩
# ----------------------------
sass:
  style: compressed
