title: "Alexis Tsui"
description: "系统、项目、商业分析与长期写作。Systems, projects, analysis and considered writing."
url: "https://alexistsui94.github.io"
baseurl: ""

permalink: /:categories/:title/

collections:
  pages:
    output: true
    permalink: /:path/

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      read_time: true
      comments: false
      share: false
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single

markdown: kramdown
highlighter: rouge
paginate: 5
paginate_path: /page:num/

timezone: Asia/Hong_Kong
locale: "zh-Hans"
